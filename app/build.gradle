plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.mans.videodownloader'
    compileSdk 35

    defaultConfig {
        applicationId 'com.mans.videodownloader'
        minSdk 26
        targetSdk 34
        versionCode 4
        versionName '4.0'
        python {
            version '3.11'
            pip {
                install 'python-telegram-bot==21.10'
                install 'yt-dlp'
            }
        }
    }
}
